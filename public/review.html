<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Content for review · Mile 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="%%BASE%%/style.css">
<style>
body{font-size:15px;line-height:1.55}
.wrap{max-width:760px}
.by{display:flex;align-items:center;gap:10px;color:var(--muted);font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.by .sign{width:22px;height:27px;font:700 16px/1 var(--display)}
.hero{padding-block:28px 20px}
.hero h1{font:700 clamp(36px,8vw,56px)/1 var(--display);margin-block:14px 8px}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.prog b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent)}
.who{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.who input{flex:1 1 180px;max-width:300px}
.who label{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ptab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:500}
.ptab.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;display:grid;gap:14px;min-width:0}
.pcard h2{font:600 22px/1.2 var(--body)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meta .when{margin-left:auto;font:500 12px/1 var(--mono);color:var(--muted)}
.lab{font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.post{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .tags{color:var(--muted);margin-top:8px;display:block}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.hook{font:600 18px/1.3 var(--body);margin:0}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details summary{cursor:pointer;font-weight:500}
details[open] summary{margin-bottom:10px}
details .subs{display:grid;gap:12px}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.btn{padding:9px 16px;border-radius:8px;font-weight:600}
.btn.sm{padding:5px 12px;font-size:13px;font-weight:500}
.btn.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.state{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state.ok{color:var(--s-approved)} .state.ch{color:var(--s-changes)} .state.rv{color:var(--s-review)}
.ask{display:grid;gap:8px;width:100%}
.small{color:var(--muted);font-size:13px}
.cmt{border-left:3px solid var(--line);padding:6px 12px;background:var(--surface2);border-radius:0 8px 8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt.agency{border-left-color:var(--accent)}
.cmt.client{border-left-color:var(--s-changes)}
.cmt small{display:block;color:var(--muted);font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.pempty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;color:var(--muted)}
.err{background:var(--warn-soft);border:1px solid var(--s-changes);border-radius:8px;padding:10px 14px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="by"><span class="sign" aria-hidden="true"><i>1</i></span><span>Mile 1 · Content for review</span></div>
  <div class="hero" id="hero"><h1>Loading…</h1></div>
  <div id="app"></div>
</div>
<script>
(function(){
const BASE='%%BASE%%';
const TOKEN=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES={post:'Post',carousel:'Carousel',reel:'Reel'};
const S={data:null,filter:'todo',asking:null,drafts:{},name:'',err:'',fatal:''};
try{S.name=localStorage.getItem('m1name')||''}catch(e){}
const fmt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtAt=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
async function call(method,p,body){
  const r=await fetch(BASE+'/r/'+encodeURIComponent(TOKEN)+p,{method,headers:{'content-type':'application/json','x-m1':'1'},body:body===undefined?undefined:JSON.stringify(body)});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(d.error||'Something went wrong. Try again.');e.status=r.status;throw e}
  return d;
}
const block=(l,v)=>v&&String(v).trim()?`<div><div class="lab">${l}</div><p class="txt">${esc(v)}</p></div>`:'';
function cmt(x){return `<div class="cmt ${x.author==='client'?'client':'agency'}"><small>${esc(x.author==='client'?x.name:'Mile 1')} · ${esc(fmtAt(x.at))}${x.kind==='resolved'?' · what we changed':''}${x.kind==='approve'?' · approved':''}</small>${esc(x.text)}</div>`}
function card(it){
  const c=it.content||{},t=it.type;let body='';
  if(t==='reel'){
    body=`${c.hook?`<div><div class="lab">Opening hook</div><p class="hook">${esc(c.hook)}</p></div>`:''}
    ${(c.script||c.shots||c.onscreen)?`<details><summary>Script, shots and on-screen text</summary><div class="subs">${block('Script',c.script)}${block('Shots',c.shots)}${block('On-screen text',c.onscreen)}</div></details>`:''}
    <div><div class="lab">Caption</div><div class="post">${esc(c.caption||'')}${c.hashtags?`<span class="tags">${esc(c.hashtags)}</span>`:''}</div></div>`;
  }else{
    body=`${block(t==='carousel'?'Slides':'Visual',c.visual)}<div><div class="lab">Caption</div><div class="post">${esc(c.caption||'')}${c.hashtags?`<span class="tags">${esc(c.hashtags)}</span>`:''}</div></div>`;
  }
  const thread=it.comments.length?`<div class="subs" style="display:grid;gap:8px">${it.comments.map(cmt).join('')}</div>`:'';
  let act='';
  if(it.state==='approved')act=`<div class="act"><div class="state ok">Approved</div><button class="btn sm" data-a="undo" data-id="${esc(it.id)}">Undo</button></div>`;
  else if(it.state==='revising'){
    const mine=it.comments.some(x=>x.author==='client'&&x.kind==='change');
    act=`<div class="act"><div class="state ch">${mine?'Your changes are being made':'Being updated'}</div>${mine?`<button class="btn sm" data-a="undo" data-id="${esc(it.id)}">Undo request</button>`:''}</div>`;
  }else if(S.asking===it.id){
    act=`<div class="act"><div class="ask"><label class="lab" for="n-${esc(it.id)}">What should change?</label><textarea id="n-${esc(it.id)}" rows="3" data-note="${esc(it.id)}" placeholder="e.g. Use a different offer, shorter caption, change the opening line">${esc(S.drafts[it.id]||'')}</textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" data-a="send" data-id="${esc(it.id)}">Send request</button><button class="btn" data-a="cancel">Cancel</button></div></div></div>`;
  }else act=`<div class="act"><button class="btn ok" data-a="approve" data-id="${esc(it.id)}">Approve</button><button class="btn" data-a="ask" data-id="${esc(it.id)}">Request changes</button>${it.round>1?'<span class="small">Updated version</span>':''}</div>`;
  return `<article class="pcard"><div class="meta"><span class="tag">${esc(it.platform)}</span><span class="tag">${esc(TYPES[it.type]||it.type)}</span>${it.pillar?`<span class="tag">${esc(it.pillar)}</span>`:''}<span class="when">${esc(fmt(it.date))}</span></div>
    <h2>${esc(it.topic||'')}</h2>${body}${thread}${act}</article>`;
}
function render(){
  const app=$('#app'),d=S.data;
  if(S.fatal){$('#hero').innerHTML=`<h1>Link not found</h1><p>${esc(S.fatal)}</p>`;app.innerHTML='';return}
  if(!d){return}
  $('#hero').innerHTML=`<h1>${esc(d.client.name)}</h1><p>Please look at each item. Approve it, or tell us what to change. We will update it and send it back to you here.</p>`;
  const its=d.items,n=its.length,ok=its.filter(i=>i.state==='approved').length,wait=its.filter(i=>i.state==='awaiting').length,rev=its.filter(i=>i.state==='revising').length;
  let h='';
  if(S.err)h+=`<div class="err" role="alert">${esc(S.err)}</div>`;
  if(!n){app.innerHTML=h+`<div class="pempty">Nothing has been sent for review yet. We will message you when it is ready.</div>`;return}
  h+=`<div class="who"><label for="yourname">Your name</label><input id="yourname" value="${esc(S.name)}" placeholder="So we know who replied" autocomplete="name"></div>`;
  h+=`<div class="prog"><div><b>${ok} of ${n}</b> approved${wait?` · <b>${wait}</b> waiting for you`:''}${rev?` · <b>${rev}</b> being updated`:''}</div><div class="bar" aria-hidden="true"><i style="width:${ok/n*100}%"></i></div></div>`;
  const tabs=[['todo',`Waiting (${wait})`],['revising',`Being updated (${rev})`],['approved',`Approved (${ok})`],['all',`All (${n})`]];
  h+=`<div class="ptabs" role="tablist">${tabs.map(([k,l])=>`<button class="ptab ${S.filter===k?'on':''}" role="tab" aria-selected="${S.filter===k}" data-a="filter" data-f="${k}">${l}</button>`).join('')}</div>`;
  const show=its.filter(i=>S.filter==='all'||(S.filter==='todo'&&i.state==='awaiting')||(S.filter==='revising'&&i.state==='revising')||(S.filter==='approved'&&i.state==='approved'));
  h+=show.length?show.map(card).join(''):`<div class="pempty">${S.filter==='todo'?'Nothing is waiting for you. Thank you.':'Nothing here.'}</div>`;
  const act=document.activeElement,keep=act&&act.dataset&&act.dataset.note,keepName=act&&act.id==='yourname';
  app.innerHTML=h;
  if(keep){const t=document.querySelector(`[data-note="${CSS.escape(keep)}"]`);if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
  if(keepName){const t=$('#yourname');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
}
async function load(){
  try{S.data=await call('GET','/data');S.fatal=''}
  catch(e){if(e.status===404)S.fatal='This review link is not valid. Please ask Mile 1 for a new one.';else S.err='Could not load. Check your connection.'}
  render();
}
async function act(fn){S.err='';try{await fn();await load()}catch(e){S.err=e.message;render()}}
const H={
  filter:t=>{S.filter=t.dataset.f;S.asking=null;render()},
  approve:t=>act(()=>call('POST','/approve/'+encodeURIComponent(t.dataset.id),{name:S.name})),
  ask:t=>{S.asking=t.dataset.id;render();const e=document.querySelector('[data-note]');if(e)e.focus()},
  cancel:()=>{S.asking=null;render()},
  send:t=>{const id=t.dataset.id,text=(S.drafts[id]||'').trim();if(!text){S.err='Describe what should change first.';render();return}S.asking=null;delete S.drafts[id];return act(()=>call('POST','/changes/'+encodeURIComponent(id),{name:S.name,text}))},
  undo:t=>act(()=>call('POST','/undo/'+encodeURIComponent(t.dataset.id),{}))
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const h=H[t.dataset.a];if(h)Promise.resolve().then(()=>h(t)).catch(()=>{})});
document.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(d.note)S.drafts[d.note]=e.target.value;
  if(e.target.id==='yourname'){S.name=e.target.value;try{localStorage.setItem('m1name',S.name)}catch(x){}}
});
let lastV=null;
async function poll(){
  try{
    const r=await fetch(BASE+'/api/version');const v=(await r.json()).v;
    if(lastV===null){lastV=v;return}
    const a=document.activeElement;
    if(v!==lastV&&!S.asking&&!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'))){lastV=v;await load()}
  }catch(e){}
}
load().then(poll);
setInterval(()=>{if(document.visibilityState==='visible')poll()},45000);
})();
</script>
</body>
</html>
