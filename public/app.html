<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mile 1</title>
<meta name="theme-color" content="#0F0F10">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2080%2080%27%3E%3Crect%20width=%2780%27%20height=%2780%27%20fill=%27%233355FF%27%20rx=%278%27/%3E%3Cg%20transform=%27translate(14.4%2018.1)%20scale(.9143)%27%20fill=%27%23F7F7F7%27%3E%3Crect%20x=%270%27%20y=%2724%27%20width=%2713%27%20height=%2724%27%20rx=%271.5%27/%3E%3Crect%20x=%2718%27%20y=%2710%27%20width=%2713%27%20height=%2738%27%20rx=%271.5%27/%3E%3Crect%20x=%2732%27%20y=%270%27%20width=%2724%27%20height=%2711%27%20rx=%271.5%27/%3E%3Crect%20x=%2745%27%20y=%270%27%20width=%2711%27%20height=%2730%27%20rx=%271.5%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="%%BASE%%/style.css">
</head>
<body>
<div class="wrap" id="root"></div>
<div class="ov" id="ov" hidden><div class="scrim" data-a="close"></div><aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Editor"></aside></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const MARK='<svg class="mark" viewBox="0 0 56 48" aria-hidden="true" focusable="false"><g fill="currentColor"><rect x="0" y="24" width="13" height="24" rx="1.5"/><rect x="18" y="10" width="13" height="38" rx="1.5"/><rect x="32" y="0" width="24" height="11" rx="1.5"/><rect x="45" y="0" width="11" height="30" rx="1.5"/></g></svg>';
(function(){
const BASE='%%BASE%%';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLATFORMS=['Instagram','LinkedIn','Facebook','YouTube Shorts','Website','Email'];
const TYPES={post:'Post',carousel:'Carousel',reel:'Reel',story:'Story',ad:'Ad',blog:'Blog',newsletter:'Newsletter'};
const ASPECT={post:'4:5',carousel:'4:5',reel:'9:16',story:'9:16',ad:'1:1',blog:'16:9',newsletter:'16:9'};
const DIMS={'4:5':[1080,1350],'9:16':[1080,1920],'1:1':[1080,1080],'16:9':[1600,900]};
const STATUSES=[['idea','Idea'],['drafted','Drafted'],['review','With client'],['changes','Changes asked'],['approved','Approved'],['published','Published']];
const LABELS={visual:'Visual brief',caption:'Caption',hashtags:'Hashtags',cta:'Call to action',hook:'Hook (first 3 seconds)',script:'Script',shots:'Shot list',onscreen:'On-screen text',videoPrompt:'AI video prompt',frames:'Story frames',headline:'Headline',primaryText:'Ad text',description:'Description line',title:'Article title',seo:'Meta description (for search results)',body:'Text',keywords:'Keywords',subject:'Subject line',preheader:'Preview text'};
const S={user:null,clients:[],items:[],comments:[],config:{},clientId:null,view:'calendar',editing:null,editClient:undefined,busy:null,stop:false,arm:null,loaded:false,pick:{},msg:{},notes:{},loginErr:'',loginEmail:'',webBusy:false,calMode:'month',calMonth:{},calDay:null,cmp:{},intelFocus:{}};

/* ---------- helpers ---------- */
const client=id=>S.clients.find(c=>c.id===id);
const cur=()=>client(S.clientId);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)};
const nextMonday=()=>{const d=new Date();const add=((8-d.getDay())%7)||7;d.setDate(d.getDate()+add);return ymd(d)};
const fmtDay=s=>{const d=parse(s);return {w:d.toLocaleDateString('en-IN',{weekday:'short'}),d:d.getDate(),full:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}};
const fmtAt=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const hasText=c=>Object.values(c||{}).some(v=>String(v||'').trim());
const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0);
const PSHORT={Instagram:'IG',LinkedIn:'LI',Facebook:'FB','YouTube Shorts':'YT',Website:'Web',Email:'Mail'};
const isOk=i=>i.status==='approved'||i.status==='published';
const ICON={approved:'✓',published:'✓',changes:'!'};
const lbl=k=>(STATUSES.find(s=>s[0]===k)||[k,k])[1];
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},4500)}
async function api(method,p,body){
  const r=await fetch(BASE+p,{method,headers:{'content-type':'application/json','x-m1':'1'},credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body)});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&p!=='/api/login'){S.user=null;S.loaded=true;render();throw {handled:true}}
  if(!r.ok)throw new Error(d.error||'Something went wrong. Try again.');
  return d;
}
const fail=e=>{if(!(e&&e.handled))toast(e&&e.message||'Something went wrong.')};
const baseUrl=()=>(S.config.baseUrl&&/^https?:/.test(S.config.baseUrl))?S.config.baseUrl:location.origin+BASE;
const reviewLink=c=>baseUrl()+'/r/'+c.token;
const itemsOf=id=>S.items.filter(i=>i.clientId===id).sort(byDate);
const cmsOf=id=>S.comments.filter(c=>c.itemId===id).sort((a,b)=>a.at-b.at);
const pendingFor=itemId=>S.comments.filter(c=>c.itemId===itemId&&c.author==='client'&&c.kind==='change'&&!c.applied);
const needsAction=id=>itemsOf(id).filter(i=>i.status==='changes').length;

async function refresh(quiet){
  try{
    const d=await api('GET','/api/state');
    Object.assign(S,{user:d.user,clients:d.clients,items:d.items,comments:d.comments,config:d.config,loaded:true});
    if(!S.clientId||!client(S.clientId))S.clientId=S.clients[0]?S.clients[0].id:null;
    render();
  }catch(e){if(!quiet)fail(e);S.loaded=true;render()}
}

/* ---------- render ---------- */
function render(){
  const root=$('#root');
  if(!S.loaded){root.innerHTML='<p class="muted" style="padding-block:32px">Loading…</p>';return}
  if(!S.user){root.innerHTML=loginHTML();return}
  root.innerHTML=topHTML()+mainHTML();
}
function loginHTML(){
  return `<form class="login" id="loginForm"><div class="lg"><span class="tile">${MARK}</span><span class="bname">Mile 1</span><span class="start">Start right</span></div>
  <h1>Sign in</h1>
  <label class="fld"><span>Email</span><input id="li-email" type="email" autocomplete="username" required value="${esc(S.loginEmail)}"></label>
  <label class="fld"><span>Password</span><input id="li-pw" type="password" autocomplete="current-password" required></label>
  ${S.loginErr?`<div class="banner warn" role="alert">${esc(S.loginErr)}</div>`:''}
  <button class="btn pri" type="submit">Sign in</button></form>`;
}
function topHTML(){
  return `<div class="top"><div class="brand">${MARK}<span class="bname">Mile 1</span><span class="tagline">Content desk</span></div>
  <nav class="chips" aria-label="Clients">${S.clients.map(c=>{const n=needsAction(c.id);return `<button class="chip ${c.id===S.clientId?'on':''}" data-a="client" data-id="${esc(c.id)}"><i class="dot" style="background:hsl(${c.hue||160} 55% 45%)"></i>${esc(c.name)}${n?`<span class="badge" title="Client comments waiting">${n}</span>`:''}</button>`}).join('')}<button class="chip add" data-a="new-client">+ Client</button></nav>
  <div class="user"><span>${esc(S.user.email)}</span><a class="btn sm" href="${BASE}/api/export">Backup</a><button class="btn sm" data-a="password">Password</button><button class="btn sm" data-a="logout">Sign out</button></div></div>`;
}
function mainHTML(){
  const c=cur();
  if(!c)return `<div class="empty"><h1>Start with a client</h1>
    <p>Every client goes through the same steps, so nothing slips between planning and posting.</p>
    <ol><li>Write the client brief once: voice, audience, content pillars.</li><li>Generate a month of ideas as a calendar.</li><li>Draft posts and reels with AI.</li><li>Send for review. The client approves or comments.</li><li>Accept comments, AI revises, send again, then publish.</li></ol>
    <button class="btn pri" data-a="new-client">Add your first client</button></div>`;
  const its=itemsOf(c.id),n=k=>its.filter(i=>i.status===k).length,inbox=needsAction(c.id);
  const briefOk=!!(c.voice&&c.pillars),draftable=its.filter(i=>i.status==='idea'&&!hasText(i.content)).length;
  let h=`<div class="head"><div><h1>${esc(c.name)}</h1><div class="sub">${esc([c.industry,c.region,(c.platforms||[]).join(', ')].filter(Boolean).join(' · '))}</div></div>
    <div class="acts"><button class="btn pri" data-a="gen-cal" ${S.busy?'disabled':''}>Generate calendar</button><button class="btn" data-a="new-item">Add item</button>
    <button class="btn" data-a="draft-all" ${draftable&&!S.busy?'':'disabled'}>Draft all (${draftable})</button>
    <a class="btn" href="${BASE}/api/clients/${esc(c.id)}/export.csv">Export CSV</a></div></div>`;
  if(S.config.ai==='demo')h+=`<div class="banner warn">Demo AI: no AI key is set, so drafts are placeholders. Add AI_API_KEY in the server settings to turn on real AI.</div>`;
  h+=`<ol class="flow"><li class="brief"><button data-a="view" data-v="brief"><span class="lbl">Brief</span><span class="n">${briefOk?'Ready':'Incomplete'}</span></button></li>`;
  STATUSES.forEach(([k,l])=>{h+=`<li class="s-${k}"><button data-a="view" data-v="${k==='changes'?'inbox':k==='review'?'review':'pipeline'}"><span class="lbl">${l}</span><span class="n">${n(k)}</span></button></li>`});
  h+=`</ol>`;
  if(S.busy)h+=`<div class="banner" role="status"><span class="spin"></span><span>${esc(S.busy)}</span>${S.stopable?'<button class="btn sm" data-a="stop">Stop</button>':''}</div>`;
  const tabs=[['calendar','Calendar'],['pipeline','Pipeline'],['review','Client review'],['inbox','Inbox'+(inbox?` (${inbox})`:'')],['intel','Competitors'],['brief','Brief']];
  h+=`<div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" role="tab" aria-selected="${S.view===k}" data-a="view" data-v="${k}">${l}</button>`).join('')}</div>`;
  h+=S.view==='pipeline'?pipelineHTML(its):S.view==='brief'?briefHTML(c):S.view==='intel'?intelHTML(c):S.view==='review'?reviewHTML(c,its):S.view==='inbox'?inboxHTML(c,its):calendarHTML(its);
  return h;
}
function card(it,mini){
  const pend=pendingFor(it.id).length;
  return `<button class="item" data-a="open-item" data-id="${esc(it.id)}"><span class="itm-top"><span class="tag">${esc(it.platform)}</span><span class="tag">${esc(TYPES[it.type]||it.type)}</span>${it.revised?'<span class="tag">Revised</span>':''}${it.image?'<span class="tag">Image</span>':''}${mini?'':`<span class="pill s-${esc(it.status)}">${esc(lbl(it.status))}</span>`}</span>
  ${mini?`<span class="when">${esc(fmtDay(it.date).w+' '+fmtDay(it.date).full)}</span>`:''}
  <span class="itm-topic">${esc(it.topic||'Untitled idea')}</span><span class="itm-pillar">${esc(it.pillar||'')}${pend?` · ${pend} client comment${pend>1?'s':''}`:''}</span></button>`;
}
function listHTML(its){
  const weeks={};its.forEach(i=>{(weeks[weekStart(i.date)]=weeks[weekStart(i.date)]||[]).push(i)});
  return Object.keys(weeks).sort().map(w=>{
    const arr=weeks[w],days={};arr.forEach(i=>{(days[i.date]=days[i.date]||[]).push(i)});
    return `<section class="week"><h3>Week of ${esc(fmtDay(w).full)} <span>${arr.length} item${arr.length>1?'s':''}</span></h3>${Object.keys(days).sort().map(d=>{const f=fmtDay(d);return `<div class="day"><div class="dt"><b>${f.d}</b>${f.w}</div><div class="cards">${days[d].map(i=>card(i)).join('')}</div></div>`}).join('')}</section>`;
  }).join('');
}
const shiftMonth=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
function calMonthKey(c,its){
  if(S.calMonth[c.id])return S.calMonth[c.id];
  const t=ymd(new Date()),mk=t.slice(0,7);
  if(its.some(i=>i.date.startsWith(mk)))return mk;
  const pick=its.find(i=>i.date>=t)||its[its.length-1];
  return (pick?pick.date:t).slice(0,7);
}
function chipHTML(i){
  return `<button class="ci st-${esc(i.status)}" draggable="true" data-a="open-item" data-id="${esc(i.id)}" data-drag="${esc(i.id)}" title="${esc((i.topic||'Untitled idea')+' · '+lbl(i.status))}"><i class="sd" aria-hidden="true">${ICON[i.status]||''}</i><span class="cx"><b>${esc(PSHORT[i.platform]||i.platform)} ${esc(TYPES[i.type]||i.type)}</b> ${esc(i.topic||'Untitled idea')}</span><span class="sr">${esc(lbl(i.status))}</span></button>`;
}
function monthHTML(c,its){
  const mk=calMonthKey(c,its),[y,m]=mk.split('-').map(Number);
  const first=new Date(y,m-1,1),off=(first.getDay()+6)%7,start=addDays(ymd(first),-off),ndays=new Date(y,m,0).getDate(),rows=Math.ceil((off+ndays)/7);
  const by={};its.forEach(i=>{(by[i.date]=by[i.date]||[]).push(i)});
  const inM=its.filter(i=>i.date.startsWith(mk)),ok=inM.filter(isOk).length,ask=inM.filter(i=>i.status==='changes').length,today=ymd(new Date());
  let g=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let n=0;n<rows*7;n++){
    const d=addDays(start,n),arr=by[d]||[],out=!d.startsWith(mk),okc=arr.filter(isOk).length;
    const st=!arr.length?'':okc===arr.length?'all':okc?'part':'none';
    g+=`<div class="cell ${out?'out':''} ${d===today?'today':''} ${st?'has-'+st:''}" data-a="open-day" data-d="${d}" data-drop="${d}">
      <div class="cn"><button class="dn" data-a="open-day" data-d="${d}" aria-label="${esc(fmtDay(d).full)}${arr.length?', '+arr.length+' items, '+okc+' approved':''}">${parse(d).getDate()}</button>${arr.length?`<span class="cc ${st}" title="${okc} of ${arr.length} approved">${okc}/${arr.length}${st==='all'?' ✓':''}</span>`:''}</div>
      <div class="cis">${arr.slice(0,3).map(chipHTML).join('')}${arr.length>3?`<span class="more">+${arr.length-3} more</span>`:''}</div></div>`;
  }
  return `<div class="calbar"><div class="calnav"><button class="btn sm" data-a="cal-prev" aria-label="Previous month">‹</button><h2>${esc(first.toLocaleDateString('en-IN',{month:'long',year:'numeric'}))}</h2><button class="btn sm" data-a="cal-next" aria-label="Next month">›</button><button class="btn sm" data-a="cal-today">Today</button></div>
    <div class="calsum"><b>${inM.length}</b> item${inM.length===1?'':'s'} · <span class="okc"><b>${ok}</b> approved</span> · <b>${inM.length-ok}</b> not approved yet${ask?` · <span class="askc"><b>${ask}</b> with changes asked</span>`:''}</div></div>
    <div class="legend" aria-label="Status key">${STATUSES.map(([k,l])=>`<span class="lg-i st-${k}"><i class="sd" aria-hidden="true">${ICON[k]||''}</i>${l}</span>`).join('')}</div>
    <div class="mgrid" role="grid" aria-label="Content calendar">${g}</div>
    <p class="small muted" style="margin:10px 0 0">Click a day to see and edit its topics. Click an item to open it. Drag an item onto another day to move it.</p>`;
}
function calendarHTML(its){
  if(!its.length)return `<div class="bx"><h3>No content yet</h3><p>Use <b>Generate calendar</b> to plan the next weeks from the brief, or add a single item by hand.</p></div>`;
  const c=cur();
  return `<div class="seg calmode" role="group" aria-label="Calendar view"><button class="${S.calMode==='month'?'on acc':''}" data-a="cal-mode" data-v="month">Month</button><button class="${S.calMode==='list'?'on acc':''}" data-a="cal-mode" data-v="list">List</button></div>`+(S.calMode==='list'?listHTML(its):monthHTML(c,its));
}
function daySheet(d){
  const c=cur(),arr=itemsOf(c.id).filter(i=>i.date===d),okc=arr.filter(isOk).length;
  return `<div class="sh-head"><h2>${esc(parse(d).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}))}</h2><button class="btn sm" data-a="close">Close</button></div><div class="sh-body">
  ${arr.length?`<p class="muted" style="margin:0"><b>${okc}</b> of ${arr.length} approved. Edit a topic here, or open an item for its full content.</p>`:`<p class="muted" style="margin:0">Nothing is planned for this day yet.</p>`}
  ${arr.map(i=>`<div class="dcard st-${esc(i.status)}"><div class="itm-top"><span class="tag">${esc(i.platform)}</span><span class="tag">${esc(TYPES[i.type]||i.type)}</span>${i.image?'<span class="tag">Image</span>':''}<span class="pill s-${esc(i.status)}">${isOk(i)?'✓ ':''}${esc(lbl(i.status))}</span></div>
    <label class="fld"><span>Topic</span><textarea rows="2" data-dtopic="${esc(i.id)}">${esc(i.topic||'')}</textarea></label>
    <div class="row"><label class="fld"><span>Content pillar</span><input data-dpillar="${esc(i.id)}" value="${esc(i.pillar||'')}"></label><label class="fld"><span>Date</span><input type="date" data-ddate="${esc(i.id)}" value="${esc(i.date)}"></label></div>
    <div class="acts"><button class="btn sm" data-a="open-item" data-id="${esc(i.id)}">Open full item</button>${pendingFor(i.id).length?`<span class="small" style="color:var(--s-changes)">${pendingFor(i.id).length} client comment${pendingFor(i.id).length>1?'s':''} waiting</span>`:''}</div></div>`).join('')}
  </div><div class="sh-foot">${arr.length?`<button class="btn pri" data-a="save-day">Save topics</button>`:''}<button class="btn ${arr.length?'':'pri'}" data-a="add-on-day" data-d="${d}">+ Add item on this day</button><button class="btn" data-a="close">Close</button></div>`;
}
function pipelineHTML(its){
  return `<div class="board">${STATUSES.map(([k,l])=>{const arr=its.filter(i=>i.status===k);
    return `<div class="col"><h3><span>${l}</span><span>${arr.length}</span></h3>${arr.length?arr.map(i=>`<div class="mini">${card(i,true)}${k==='drafted'&&hasText(i.content)?`<button class="btn sm" data-a="send-one" data-id="${esc(i.id)}">Send for review</button>`:''}${k==='approved'?`<button class="btn sm" data-a="publish" data-id="${esc(i.id)}">Mark published</button>`:''}${k==='changes'?`<button class="btn sm" data-a="view" data-v="inbox">Open inbox</button>`:''}</div>`).join(''):`<div class="none">Nothing here</div>`}</div>`}).join('')}</div>`;
}
const cmpDraft=c=>S.cmp[c.id]||(S.cmp[c.id]=(c.competitors&&c.competitors.length?c.competitors:[{name:'',url:''}]).map(x=>({name:x.name,url:x.url})));
const list=(a)=>a&&a.length?`<ul class="bul">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">None found.</p>';
function intelHTML(c){
  const rows=cmpDraft(c),i=c.intel;
  let h=`<div class="stack"><div class="bx"><h3>Competitors</h3><p class="muted" style="margin-bottom:10px">Add up to 6. With a website address the AI reads their site. Without one it only uses what it already knows, which is less reliable.</p>
  <div class="cmps">${rows.map((r,n)=>`<div class="cmp"><input data-cmp="${n}" data-k="name" placeholder="Name" aria-label="Competitor name" value="${esc(r.name)}"><input data-cmp="${n}" data-k="url" placeholder="Website (optional)" aria-label="Competitor website" value="${esc(r.url)}"><button class="btn sm" data-a="cmp-del" data-n="${n}" aria-label="Remove this competitor">Remove</button></div>`).join('')}</div>
  <div class="acts" style="margin-top:10px"><button class="btn sm" data-a="cmp-add" ${rows.length>=6?'disabled':''}>+ Add competitor</button><button class="btn sm" data-a="cmp-suggest" ${S.busy?'disabled':''}>Suggest competitors with AI</button><button class="btn sm" data-a="cmp-save">Save list</button></div>
  <label class="fld" style="margin-top:14px"><span>Focus (optional)</span><input id="intel-focus" placeholder="e.g. Diwali season, launching a new menu, hiring" value="${esc(S.intelFocus[c.id]||'')}"></label>
  <div class="acts" style="margin-top:12px"><button class="btn pri" data-a="run-intel" ${S.busy?'disabled':''}>${i?'Run the analysis again':'Analyse competitors and trends'}</button>${i?'<button class="btn danger sm" data-a="intel-clear">Clear result</button>':''}</div></div>`;
  if(!i){return h+`<div class="bx"><h3>What you get</h3><p>A short read of the market, how each competitor presents itself, the gaps they leave open, angles that suit ${esc(c.name)}, and trending content ideas you can add to the calendar in one click. The findings also feed into calendar planning and drafting for this client.</p></div></div>`}
  const read=i.read||[],okN=read.filter(x=>x.ok).length;
  h+=`<div class="bx"><h3>Market summary</h3><p>${esc(i.summary||'No summary.')}</p><p class="small muted" style="margin-top:10px">${esc(fmtAt(i.at))} · ${i.live?'':'Demo result. '}${read.length?`Read ${okN} of ${read.length} competitor website${read.length>1?'s':''}. `:''}Trends come from the AI's general knowledge${i.searched?' and Google Search':''}, not from live social media data. Check them before you rely on them.</p>
    ${read.filter(x=>!x.ok).length?`<p class="small muted" style="margin:6px 0 0">Could not read: ${read.filter(x=>!x.ok).map(x=>esc(x.name)+(x.note?' ('+esc(x.note)+')':'')).join(', ')}.</p>`:''}

function toJpeg(src,w,h){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const iw=im.naturalWidth||w,ih=im.naturalHeight||h;
      for(let scale=1;scale>0.3;scale-=0.2){
        const cw=Math.round(w*scale),ch=Math.round(h*scale),c=document.createElement('canvas');c.width=cw;c.height=ch;
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);
        const r=Math.max(cw/iw,ch/ih),dw=iw*r,dh=ih*r;x.drawImage(im,(cw-dw)/2,(ch-dh)/2,dw,dh);
        for(let q=.86;q>=.45;q-=.08){const out=c.toDataURL('image/jpeg',q);if(out.length<=560000)return res(out)}
      }
      rej(new Error('That picture is too detailed to shrink enough. Try a simpler one.'));
    };
    im.onerror=()=>rej(new Error('Could not read that image.'));
    im.src=src;
  });
}

  const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();c.classList.remove('drop');
  const id=e.dataTransfer.getData('text/plain'),it=S.items.find(x=>x.id===id);if(!it||it.date===c.dataset.drop)return;
  try{await api('PUT','/api/items/'+id,{date:c.dataset.drop});await refresh(true);toast('Moved to '+fmtDay(c.dataset.drop).full+'.')}catch(err){fail(err)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeSheet()});

/* typing in inbox boxes must not be wiped by the background refresh */
const typing=()=>{const a=document.activeElement;return !!a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')};
/* Cheap check every 30 seconds: only reload everything when something changed. */
let lastV=null;
async function poll(){
  try{
    const r=await fetch(BASE+'/api/version',{credentials:'same-origin'});const v=(await r.json()).v;
    if(lastV===null){lastV=v;return}
    if(v!==lastV){if(typing()||!$('#ov').hidden||S.busy)return;lastV=v;await refresh(true)}
  }catch(e){}
}
setInterval(()=>{if(document.visibilityState==='visible'&&S.user)poll()},30000);
refresh(true).then(poll);
})();
</script>
